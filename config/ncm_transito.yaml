# OBSOLETO — mantido como registro histórico. NÃO reativar.
#
# Este filtro partia da premissa de que os capítulos 27 (combustíveis) e 31
# (fertilizantes) seriam "quase tudo trânsito" por Itaqui. A premissa nunca foi
# medida: o que os dados do ComexStat mostravam era apenas que esses capítulos
# DOMINAM as importações atribuídas ao MA (69,4% + 22,1%) — dominância que foi
# lida, incorretamente, como trânsito.
#
# Medição no Siscomex (APL_SISCOMEX, 2022, despachado no MA), por
# TDS_UF_IMPORTADOR, que é o domicílio fiscal real:
#
#   cap.27 → importador MA: R$ 26,45 bi | outra UF: R$ 2,89 bi  →  9,8% trânsito
#   cap.31 → importador MA: R$  7,87 bi | outra UF: R$ 1,73 bi  → 15,4% trânsito
#
# Ou seja, o filtro descartava R$ 34,3 bi de importação legítima do Maranhão
# para remover R$ 4,6 bi de trânsito. Em 2022 ele entregava R$ 3,3 bi contra os
# R$ 37,5 bi medidos no Siscomex.
#
# A fonte correta é o snapshot do Siscomex (config/fontes.yaml → importacoes).
# Lista vazia mantém o filtro desligado caso o ComexExtractor seja usado como
# fallback nos anos sem cobertura do Siscomex.

capitulos_transito: []
