# Ordem das cascatas de fontes de dados — Calculadora de Gap Tributário ICMS-MA
#
# Cada variável da fórmula VRR tem uma cascata de fontes em ordem de prioridade.
# A primeira fonte que responde com sucesso vence; ExtractionError leva à próxima.
#
# NOTA: hoje a ordem é orquestrada em cli.py. Este arquivo documenta a ordem
# vigente e é o ponto de extensão para torná-la configurável sem mexer no código.

vab:
  # IMESC: Relatório PIB Trimestral do MA, Tabela 15 (valores correntes).
  # Cobertura 2021-2025. VAB direto (sem fator PIB×0,8932), trimestral nativo.
  # Anos <2021 caem para o IBGE SIDRA.
  cascata:
    - imesc          # ImescPibExtractor (fonte nº1)
    - ibge_sidra     # IBGEExtractor (fallback, anos <2021)
    - ipeadata       # (planejado)
    - bcb_focus      # (planejado)
    - autoarima      # (planejado)
    - manual         # --vab-manual

importacoes:
  # Siscomex: única fonte com o domicílio fiscal do importador
  # (TDS_UF_IMPORTADOR), que separa a importação maranhense da carga em
  # trânsito por Itaqui. Lido do snapshot agregado gerado no cluster da SEFAZ
  # por scripts/snapshot_siscomex.py — o Oracle não é alcançável de fora.
  # Cobertura confiável de 2013 em diante (2009-2012 têm poucas DIs).
  # O MDIC entra como fallback, mas o SG_UF_NCM dele é local de desembaraço,
  # então superestima o MA. NÃO reativar o filtro NCM cap.27/31: medimos que
  # 90% do cap.27 e 70% do cap.31 são de importadores do MA.
  cascata:
    - siscomex_snapshot  # SiscomexSnapshotExtractor (fonte nº1)
    - mdic_comex         # ComexExtractor (fallback, anos <2013)
    - manual             # --imp-manual

exportacoes:
  cascata:
    - mdic_comex
    - manual          # --exp-manual

icms_arrecadado:
  # GFIS2 é a fonte nº 1: é o sistema da própria SEFAZ-MA e o número que bate
  # com o portal da casa. Cobertura confiável a partir de 2020 — em 2019 o
  # Parquet só entra em regime normal a partir de agosto (jan-jul somam menos
  # de R$ 100 mi/mês contra ~R$ 600 mi), o que produzia o VRR 2019 = 0,213.
  #
  # A soma cobre TODAS as parcelas de ICMS. Somar só normal+imp+st_sda
  # subestimava o total em 10-15%: faltavam FCP e dívida ativa, as duas maiores
  # omissões. Com a soma completa, GFIS2 e SIGDEF convergem dentro de ~1%
  # (2020: +0,3%, 2021: -2,3%, 2022: -0,9%, 2023: -1,1%).
  #
  # SIGDEF (CONFAZ, parquet limpo, ICMS total na posição 21 do export) fica como
  # fallback e controle cruzado. Cobertura 1997-2023.
  cascata:
    - gfis2_parquet   # ArrecadacaoExtractor (fonte nº1)
    - sigdef          # SigdefIcmsExtractor (fallback e validação cruzada)

ptax:
  cascata:
    - bcb_olinda
